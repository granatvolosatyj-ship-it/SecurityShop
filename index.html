<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SecurityShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--card:#0b0b0c;--line:#1d1d20;--mut:#8a8a93;--red:#e5484d;--red2:#a3202a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,10,10,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-style:italic;font-weight:800;font-size:21px;letter-spacing:.3px}
.logo span{color:var(--red)}
.lang{border:1px solid var(--line);background:#0b0b0c;color:#fff;border-radius:14px;padding:7px 13px;font-size:13px;font-weight:700}
main{padding:16px 16px 130px;min-height:100vh}
h1{font-size:34px;margin:6px 0 16px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;background:#0b0b0c;border:1px solid var(--line);border-radius:18px;padding:15px 16px 15px 46px;color:#fff;font-size:16px;outline:none}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative}
.ph{aspect-ratio:3/4;background:#000;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph:after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,#0b0b0c);pointer-events:none}
.card.sold .ph img{filter:grayscale(1) brightness(.55)}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:2;padding:0}
.fav svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.fav.on svg{fill:var(--red);stroke:var(--red)}
.badge{position:absolute;top:10px;left:10px;z-index:2;background:linear-gradient(90deg,#e5484d,#a3202a);padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700}
.meta{padding:2px 14px 14px;position:relative;z-index:1}
.meta small{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:block;min-height:13px}
.meta b{display:block;font-size:15px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#ff6b6f;font-weight:700;font-size:16px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:70px 20px;line-height:1.5}
.empty .circle{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:#0b0b0c;margin:0 auto 18px;display:grid;place-items:center}
.empty .circle svg{width:34px;height:34px;fill:none;stroke:#aaa;stroke-width:1.8}
nav.bar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;padding:10px 6px;border-radius:32px;background:linear-gradient(180deg,#1b0c0e,#0a0a0a);border:1px solid #2a1a1c;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;flex:1;padding:4px 0}
nav button.on{color:#fff}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:20px;border:1px solid var(--line);background:#0b0b0c;color:#ddd;font-size:14px}
.chip i{font-style:normal;color:var(--mut);margin-left:5px}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip.on i{color:#555}
.foot{text-align:center;color:var(--mut);padding:34px 10px 0;font-size:14px;line-height:1.5}
.foot .logo{color:#fff;margin-bottom:8px;font-size:24px}
.soc{display:inline-flex;margin-top:14px;align-items:center;gap:8px;border:1px solid var(--line);background:#0b0b0c;color:#fff;border-radius:20px;padding:11px 18px;font-size:14px}
.overlay{position:fixed;inset:0;background:#000;z-index:50;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.overlay.show{display:block}
.pback{position:fixed;top:12px;left:12px;z-index:70;width:38px;height:38px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:20px;line-height:1}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#0b0b0c}
.gal::-webkit-scrollbar{display:none}
.gal .slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:3/4;max-height:68vh;width:100%}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{width:100%;height:100%;background:#0b0b0c}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:#333;transition:.2s}
.dots i.on{width:22px;background:#fff}
.pbody{padding:8px 18px calc(110px + env(safe-area-inset-bottom))}
.pbody small{color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:600}
.pbody h2{margin:4px 0 8px;font-size:26px;line-height:1.2}
.pbody .price{font-size:24px}
.pbody h3{margin:22px 0 10px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.sz{display:flex;flex-wrap:wrap;gap:8px}
.sz span{min-width:46px;text-align:center;padding:10px 14px;border:1px solid #2b2b30;border-radius:14px;background:#0b0b0c;font-weight:600}
.pbody p{color:#d0d0d6;line-height:1.55;white-space:pre-wrap;margin:0}
.pbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 35%);z-index:60}
.btn{border:0;border-radius:18px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#e5484d,#a3202a);flex:1}
.btn.full{width:100%;margin-bottom:14px}
.btn:disabled{opacity:.5}
.btn.ghost{background:#0b0b0c;border:1px solid var(--line);flex:none;width:56px;padding:0;display:grid;place-items:center}
.btn.ghost svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.btn.ghost.on svg{fill:var(--red);stroke:var(--red)}
.arow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px}
.arow img,.arow .t{width:56px;height:70px;object-fit:cover;border-radius:12px;background:#000;flex:none}
.arow .ai{flex:1;min-width:0}
.arow .ai b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.arow .ai span{color:var(--mut);font-size:13px}
.ab{display:flex;gap:6px}
.ab button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#111;color:#fff;font-size:16px}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.fhead h2{margin:0;font-size:22px}
.fhead button{background:#111;border:1px solid var(--line);color:#fff;border-radius:14px;padding:9px 14px;font-size:14px}
.form{padding:8px 18px calc(40px + env(safe-area-inset-bottom))}
.form label{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.form input[type=text],.form input[type=number],.form textarea{width:100%;background:#0b0b0c;border:1px solid var(--line);border-radius:14px;padding:14px;color:#fff;font-size:16px;outline:none;font-family:inherit}
.form textarea{min-height:100px;resize:vertical}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pth{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#0b0b0c;border:1px solid var(--line)}
.pth img{width:100%;height:100%;object-fit:cover}
.pth .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;padding:0}
.pth .l{position:absolute;bottom:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13px;padding:0}
.pth .c{position:absolute;bottom:4px;left:4px;background:var(--red);border-radius:8px;font-size:10px;padding:3px 6px;font-weight:700}
.padd{aspect-ratio:3/4;border-radius:14px;border:1px dashed #3a3a40;display:grid;place-items:center;color:var(--mut);font-size:30px;position:relative;background:#0b0b0c}
.padd input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.hint{color:var(--mut);font-size:12px;margin-top:6px}

.logo{font-style:normal;font-weight:900;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
h1.row{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#0b0b0c;color:#fff;font-size:18px;padding:0}
.bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px;margin-bottom:8px}
.bn::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#3a0d12,#0b0b0c 70%);border:1px solid #2a1a1c}
.bs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bs:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.1) 75%)}
.bs .bt{position:absolute;left:18px;right:30%;bottom:18px;z-index:2}
.bs .bt b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.bs .bt span{display:block;color:#ddd;font-size:13px;margin-top:6px}
.bs .go{position:absolute;right:16px;bottom:16px;z-index:2;width:38px;height:38px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:18px}
.bdots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.bdots i{width:6px;height:6px;border-radius:3px;background:#333;transition:.2s}
.bdots i.on{width:20px;background:var(--red)}
.tile{position:relative;border-radius:26px;overflow:hidden;border:1.5px solid var(--red);background:#0b0b0c;box-shadow:0 0 24px rgba(229,72,77,.18),inset 0 0 30px rgba(229,72,77,.08);text-align:left;color:#fff;width:100%;display:block;padding:0}
.tile.big{height:190px;margin-bottom:12px}
.tile .cv{position:absolute;inset:0;display:flex}
.tile .cv img{flex:1;min-width:0;height:100%;object-fit:cover}
.tile.big:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 5%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.05))}
.tile .tx{position:absolute;left:20px;bottom:18px;z-index:2}
.tile .tx b{display:block;font-size:30px;font-weight:900;letter-spacing:-.5px}
.tile .tx span{display:inline-block;margin-top:6px;font-size:13px;color:#ffb3b6;font-weight:600}
.tile .ar{position:absolute;right:16px;top:16px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.tile.sq{aspect-ratio:1/1.02;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.tile.sale{background:radial-gradient(circle at 100% 0,#5a1118,#0b0b0c 65%)}
.tile.whl{background:radial-gradient(circle at 0 100%,#4a0f15,#0b0b0c 65%)}
.tile small{font-size:12px;color:#ffb3b6;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tile .big2{font-size:44px;font-weight:900;line-height:1;color:#fff}
.tile .big2 em{font-style:normal;color:var(--red)}
.tile .sub{font-size:12px;color:#c9c9cf;line-height:1.35}
.tile .t2{font-size:20px;font-weight:800;line-height:1.1}
.tile svg.mw{position:absolute;right:-30px;bottom:-30px;width:92px;height:92px;opacity:.95}
.mq{overflow:hidden;margin:6px -16px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;white-space:nowrap}
.mqt{display:inline-block;animation:mq 26s linear infinite;will-change:transform}
.mqt span{font-size:20px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 16px}
.mqt i{font-style:normal;color:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.sec h2{margin:0;font-size:22px}
.sec button{background:none;border:0;color:var(--red);font-size:14px;font-weight:700}
.badge.sale{background:linear-gradient(90deg,#e5484d,#a3202a);overflow:hidden;box-shadow:0 0 12px rgba(229,72,77,.55)}
.badge.sale:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%{left:-70%}55%,100%{left:130%}}
.tbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.hasimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.78))}
.tile.hasimg svg.mw{display:none}
.old{color:var(--mut);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:500}
.fbar{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fb{flex:none;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:#0b0b0c;color:#fff;font-size:14px;font-weight:600}
.fb.on{border-color:var(--red);color:#ff8a8e}
.cnt{color:var(--mut);font-size:13px;margin:0 0 10px}
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;background:#0e0e10;border-radius:26px 26px 0 0;border-top:1px solid #2a2a2e;z-index:90;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:none}
.sbg.show,.sheet.show{display:block}
.sheet h3{margin:0 0 12px;font-size:20px}
.opt{display:flex;align-items:center;gap:14px;padding:13px 4px;font-size:17px;border:0;background:none;color:#fff;width:100%;text-align:left}
.opt .rd{width:26px;height:26px;border-radius:50%;background:#2a2a2d;display:grid;place-items:center;flex:none}
.opt.on .rd{background:#fff}
.opt.on .rd:after{content:"";width:9px;height:9px;border-radius:50%;background:#000}
.opt .ck{border-radius:8px}
.opt.on .ck{background:var(--red)}
.opt.on .ck:after{content:"✓";width:auto;height:auto;background:none;color:#fff;font-size:15px;border-radius:0}
.shr{display:flex;gap:10px;margin-top:14px}
.shr .btn{padding:14px}
.shr .btn.g{background:#1a1a1d}
.prow{display:flex;gap:10px}
.prow input{flex:1;min-width:0;background:#0b0b0c;border:1px solid var(--line);border-radius:14px;padding:14px;color:#fff;font-size:16px;outline:none}
.wwrap{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:8px auto 18px}
.wwrap .ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid #f5cf6b;z-index:3;filter:drop-shadow(0 3px 5px #000)}
.wheel{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.7,.1,1);filter:drop-shadow(0 0 26px rgba(229,72,77,.5))}
.hub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b8,#d9a441 55%,#8a5a12);border:3px solid #fff4c4;box-shadow:0 0 14px rgba(245,207,107,.6);display:grid;place-items:center;font-weight:900;font-size:13px;color:#3a2500;z-index:2}
.pz{border:1.5px solid var(--red);border-radius:24px;padding:18px;background:radial-gradient(circle at 100% 0,#3a0d12,#0b0b0c 70%);margin-top:6px}
.pz h3{margin:0 0 4px;font-size:15px;color:#ffb3b6;text-transform:uppercase;letter-spacing:.06em}
.pz .pv{font-size:34px;font-weight:900;margin:2px 0 8px}
.pz .code{font-size:34px;font-weight:900;letter-spacing:.2em;text-align:center;border:1px dashed #666;border-radius:16px;padding:12px;margin:12px 0;background:#000}
.pz .st{color:var(--mut);font-size:13px;text-align:center;line-height:1.5}
.pz .tm{font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.pz.used{border-color:#333;background:#0b0b0c;opacity:.8}
.wnote{text-align:center;color:var(--mut);font-size:13px;line-height:1.5;margin:10px 0 18px}
.chips.adm{padding-bottom:6px}
.sub2{margin:22px 0 10px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.inl{display:flex;gap:8px;margin-bottom:10px}
.inl input,.inl select,.sel{flex:1;min-width:0;background:#0b0b0c;border:1px solid var(--line);border-radius:14px;padding:13px;color:#fff;font-size:16px;outline:none;font-family:inherit}
.inl button{border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:700;padding:0 16px;font-size:15px}
.sel{width:100%}
.wrow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.45}
.wrow b{font-size:15px}
.wrow .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.tag{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:700;background:#1d3b24;color:#7be090}
.tag.no{background:#3b1d1f;color:#ff8a8e}
.tag.gr{background:#222;color:#aaa}
.sm{border:1px solid var(--line);background:#111;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}
.cvp{width:100%;aspect-ratio:16/8;border-radius:16px;object-fit:cover;background:#0b0b0c;border:1px solid var(--line);margin-bottom:8px;display:block}
.fileb{position:relative;display:block;text-align:center;border:1px dashed #3a3a40;border-radius:14px;padding:14px;color:var(--mut);font-size:15px}
.fileb input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.tile{box-shadow:none;border:1px solid #2a2a2e}
.tile.big{height:118px;margin-bottom:12px;border:1.5px solid var(--red)}
.tile.sq{height:104px;aspect-ratio:auto;padding:0;display:block}
.tile.sale{background:linear-gradient(135deg,#d6393f,#7d1520);border:0}
.tile.whl{background:#0e0e10}
.tile .tx{left:18px;bottom:auto;top:50%;transform:translateY(-50%);right:64px}
.tile .tx b{font-size:20px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
.tile.big .tx b{font-size:24px}
.tile .tx span{margin-top:5px;font-size:13px;color:#c9c9cf;font-weight:500}
.tile.sale .tx span{color:#ffd9db}
.tile .ar{right:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;background:#fff;color:#000;font-weight:700}
.two{margin-bottom:16px}
.tile.sq svg.mw{right:62px;bottom:-22px;width:70px;height:70px;opacity:.35}
.tile.hasimg svg.mw{display:none}
.mq{padding:11px 0;margin:4px -16px 20px;border-color:#17171a}
.mqt{animation-duration:34s}
.mqt span{font-size:14px;font-weight:500;letter-spacing:.16em;color:#8f8f98;margin:0 18px}
.mqt i{font-size:8px;color:var(--red);opacity:.8}
.tile .tx b{font-weight:700}
.tile.big .tx b{font-size:22px}
.sec h2,h1{font-weight:700}
.logo{font-weight:800}
.mqt i{display:none}
.mqt span{font-size:15px;font-weight:600;letter-spacing:.1em;color:#e9e9ee;margin:0 12px}
.mq{padding:13px 0;border-color:#1f1f23}
.bs.plain:after{display:none}
.bs.plain .go{background:rgba(0,0,0,.55)}
.grid{gap:10px}
.card{border-radius:20px}
.ph{aspect-ratio:1/1.1}
.ph:after{height:25%}
.meta{display:flex;align-items:flex-end;gap:8px;padding:0 12px 12px}
.meta .mi{flex:1;min-width:0}
.meta small{font-size:10px;min-height:12px}
.meta b{font-size:14px;font-weight:600;margin:2px 0 3px}
.card .price{font-size:15px}
.card .old{font-size:12px;margin-left:5px}
.mgo{flex:none;width:30px;height:30px;border-radius:50%;background:#1b1b1e;display:grid;place-items:center;font-size:14px;color:#fff}
.fav{width:32px;height:32px;top:8px;right:8px}
.fav svg{width:16px;height:16px}
.card .badge{top:8px;left:8px;font-size:11px;padding:4px 9px;border-radius:9px}
.card .old{display:block;margin:1px 0 0;white-space:nowrap}
.mqt span{font-size:13px;font-weight:500;letter-spacing:.14em;color:rgba(255,255,255,.4);margin:0 12px;cursor:pointer}
.szb{min-width:46px;text-align:center;padding:10px 14px;border:1px solid #2b2b30;border-radius:14px;background:#0b0b0c;font-weight:600;color:#fff;font-size:16px}
.szb.on{background:#fff;color:#000;border-color:#fff}
.szb.need{border-color:var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.anim .card{animation:cardIn .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.anim .card,.anim .tile,.anim .btn{transition:transform .12s}
.anim .card:active,.anim .tile:active,.anim .btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.anim .card{animation:none}}
#splash{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .sl{font-size:34px;font-weight:900;letter-spacing:.08em;text-align:center;line-height:1.1;animation:spl 1s ease both}
#splash .sbar{width:90px;height:3px;border-radius:2px;background:#1b1b1e;margin-top:26px;overflow:hidden;position:relative}
#splash .sbar:after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--red);animation:sbar 1.1s ease-in-out infinite}
@keyframes spl{from{opacity:0;transform:scale(.94);letter-spacing:.2em}to{opacity:1;transform:none;letter-spacing:.08em}}
@keyframes sbar{to{left:100%}}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stc b{display:block;font-size:24px}
.stc span{font-size:12px;color:var(--mut)}
.srow{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:6px;font-size:14px}
.srow b{color:#ff6b6f;flex:none}
.srow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zbg{position:fixed;inset:0;background:#000;z-index:120;display:none}
.zbg.show{display:block}
.zg{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.zg::-webkit-scrollbar{display:none}
.zg.zoomed{overflow:hidden}
.zg.zoomed .zs img{touch-action:none}
.zs{flex:0 0 100%;scroll-snap-align:start;display:grid;place-items:center;height:100%;overflow:hidden}
.zs img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pan-x;will-change:transform;-webkit-user-select:none;user-select:none}
.zclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;padding:0}
.zcnt{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#aaa;font-size:13px;z-index:3}
.gal .slide img{cursor:zoom-in}
.card .badge.drop{top:auto;bottom:8px;left:8px;background:#1f7a46;box-shadow:none}
.meta small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond{margin-top:8px;color:var(--mut);font-size:14px}
.cond b{color:#fff;font-weight:600}
.badge.sale{position:relative}
.card .badge.sale{position:absolute}


.hr{display:flex;gap:8px}
html.light{filter:invert(1) hue-rotate(180deg);background:#fff}
html.light body{background:#000}
html.light img,html.light .tbg,html.light .zv,html.light video{filter:invert(1) hue-rotate(180deg)}

.card{transition:transform .15s ease;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card:active{transform:scale(.97)}
.card .ph img{transition:transform .35s ease}
.card:active .ph img{transform:scale(1.06)}
nav.bar{background:linear-gradient(180deg,rgba(27,12,14,.55),rgba(10,10,10,.55))!important;backdrop-filter:blur(28px) saturate(1.5)!important;-webkit-backdrop-filter:blur(28px) saturate(1.5)!important}
.zcap{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:700;font-size:16px;z-index:3;padding:0 20px;text-shadow:0 1px 6px #000}
.inv{border:1px solid #2a2a2e;border-radius:22px;padding:16px;margin:18px 0;background:radial-gradient(circle at 100% 0,#3a0d12,#0b0b0c 70%)}
.inv b{font-size:18px;display:block}
.inv p{margin:6px 0 12px;color:#c9c9cf;font-size:13px;line-height:1.4}
.inv .cp{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin-top:8px;border:1px dashed var(--red);border-radius:12px;font-size:13px}

.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin:8px 0 2px}
.bars i{flex:1;background:var(--red);border-radius:3px 3px 0 0;min-height:2px;position:relative}

};
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  catalog:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  fav:'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
  admin:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};

const S = { lang: null, products: [], favs: new Set(), isAdmin: false, cfg: { shop:'SecurityShop', manager:'', tiktok:'' },
  coupons: [], refAmount: 500, aCoupons: [], lp: 0, brands: [], banners: [], prizes: [], home: { saleMax: 80, cover: null, coverSale: null, coverWheel: null, wheelProduct: null }, spin: null,
  tab: 'home', q: '', cat: '', fBrand: new Set(), fSize: new Set(), pmin: '', pmax: '', sort: 'def', sheet: null,
  at: 'items', aStats: null, aAud: 0, favPrice: {}, zoom: null, pvSize: '', aPrizes: [], aSpins: [], pv: null, form: null, rot: 0, spinning: false };
try { S.lang = localStorage.getItem('lang'); } catch(e){}
if (!S.lang) {
  const lc = (tg.user && tg.user.language_code) || navigator.language || 'ru';
  S.lang = lc.toLowerCase().startsWith('ru') ? 'ru' : 'en';
}
const T = k => (I[S.lang] && I[S.lang][k]) || k;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const price = n => Number(n).toLocaleString(S.lang === 'ru' ? 'ru-RU' : 'en-US') + ' ₽';
const tr = (p, k) => p[k + '_' + S.lang] || p[k + '_ru'] || p[k + '_en'] || '';
const sizesOf = p => String(p.sizes || '').split(/[,;]/).map(s => s.trim()).filter(Boolean);
const disc = p => (p.old_price > p.price && p.old_price > 0) ? Math.round((1 - p.price / p.old_price) * 100) : 0;
const plural = n => { const w = I[S.lang].stock; if (S.lang === 'en') return n === 1 ? w[0] : w[1];
  const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? w[0] : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? w[1] : w[2]; };
const prizeLabel = z => z.prize_kind === 'percent' || z.kind === 'percent' ? '-' + (z.prize_value || z.value) + '%' : '-' + (z.prize_value || z.value) + ' ₽';
const withPrize = (p, z) => Math.max(0, z.prize_kind === 'percent' ? Math.round(p.price * (1 - z.prize_value / 100)) : p.price - z.prize_value);
const dt = s => new Date(s).toLocaleString(S.lang === 'ru' ? 'ru-RU' : 'en-GB', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const COND = { new: ['Новое', 'New'], excellent: ['Отличное', 'Excellent'], good: ['Хорошее', 'Good'], fair: ['Удовлетворительное', 'Fair'] };
const condL = c => COND[c] ? COND[c][S.lang === 'ru' ? 0 : 1] : '';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hms = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':'); };

async function api(path, opt = {}) {
  const r = await fetch(path, {
    method: opt.method || 'GET',
    headers: { 'content-type': 'application/json', 'X-Init-Data': tg.initData || '' },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if (!r.ok) { const e = new Error(await r.text()); e.status = r.status; throw e; }
  return r.json();
}
const SPLASH = true; // поставьте false, чтобы убрать заставку
const t0 = Date.now();
function hideSplash() {
  const el = $('splash'); if (!el) return;
  if (!SPLASH) return el.remove();
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 600); }, Math.max(0, 1100 - (Date.now() - t0)));
}
function track(kind, pid, size) {
  if (!tg.initData) return;
  api('/api/track', { method: 'POST', body: { kind, product_id: pid, size } }).catch(() => {});
}
async function loadAll() {
  const d = await api('/api/bootstrap');
  S.cfg = d.config; S.isAdmin = d.isAdmin; S.products = d.products; S.favs = new Set(d.favorites);
  S.favPrice = d.favPrices || {}; S.brands = d.brands; S.banners = d.banners; S.prizes = d.prizes; S.home = d.home; S.spin = d.spin; S.coupons = d.coupons || []; S.refAmount = d.refAmount || 500;
}

/* ---------- lists / filters ---------- */
const inStock = () => S.products.filter(p => !p.sold);
const maxDisc = () => inStock().reduce((m, p) => Math.max(m, disc(p)), 0);
function list(mode) {
  const q = S.q.trim().toLowerCase();
  const mn = parseInt(S.pmin, 10), mx = parseInt(S.pmax, 10);
  let r = S.products.filter(p => {
    if (mode === 'sale' && (!disc(p) || p.sold)) return false;
    if (mode === 'catalog' && S.cat && p.category !== S.cat) return false;
    if (S.fBrand.size && !S.fBrand.has(p.brand)) return false;
    if (S.fSize.size && !sizesOf(p).some(x => S.fSize.has(x.toUpperCase()))) return false;
    if (mn && p.price < mn) return false;
    if (mx && p.price > mx) return false;
    if (!q) return true;
    return (p.title_ru + ' ' + p.title_en + ' ' + p.category + ' ' + p.brand).toLowerCase().includes(q);
  });
  const by = { date: (a, b) => new Date(b.created_at) - new Date(a.created_at), asc: (a, b) => a.price - b.price,
    desc: (a, b) => b.price - a.price, disc: (a, b) => disc(b) - disc(a), discAsc: (a, b) => disc(a) - disc(b) }[S.sort];
  if (by) r = r.slice().sort(by);
  return r;
}
function card(p, i) {
  const on = S.favs.has(p.id), d = disc(p);
  const img = p.photos[0] ? `<img loading="lazy" src="/img/${p.photos[0]}">` : '<div class="noimg"></div>';
  const badge = (p.sold ? `<span class="badge">${T('sold')}</span>` : d ? `<span class="badge sale">-${d}%</span>` : '') +
    (!p.sold && on && S.favPrice[p.id] > p.price ? `<span class="badge drop">↓ ${T('cheaper')}</span>` : '');
  return `<div class="card ${p.sold ? 'sold' : ''}" style="--i:${Math.min(i || 0, 8)}" data-act="open" data-id="${p.id}">
    <div class="ph">${img}${badge}
    <button class="fav ${on ? 'on' : ''}" data-act="fav" data-id="${p.id}">${ICON.fav}</button></div>
    <div class="meta"><div class="mi"><small>${esc(p.brand || p.category)}${condL(p.cond) ? ' · ' + esc(condL(p.cond)) : ''}</small><b>${esc(tr(p, 'title'))}</b>
    <span class="price">${price(p.price)}</span>${d ? `<span class="old">${price(p.old_price)}</span>` : ''}</div><div class="mgo">→</div></div></div>`;
}
function gridHtml(l, emptyKey) {
  if (!l.length) return `<div class="empty"><div class="circle">${ICON.search}</div>${T(emptyKey || 'nothing')}</div>`;
  return l.map(card).join('');

  const n = S.refAmount || 500;

  if (!S.cfg.bot || !tg.user) return;

  return `<div class="foot"><div class="logo">${esc(S.cfg.shop)}</div>${T('about')}<br>
    ${S.cfg.tiktok ? `<button class="soc" data-act="tiktok">♪ ${T('tiktok')}</button>` : ''}</div>`;

function bannerList() {
  if (S.banners.length) return S.banners;
  return [
    { id: 0, title_ru: 'Мы в TikTok', title_en: 'Follow us on TikTok', text_ru: 'Обзоры и новинки', text_en: 'Reviews and new drops', target: 'tiktok' },

/* ---------- WHEEL ---------- */
function wheelSvg() {
  const P = S.prizes, N = P.length; if (N < 2) return '';
  const R = 132, C = 150, a = 2 * Math.PI / N; let sl = '';
  P.forEach((z, i) => {
    const x1 = C + R * Math.sin(i * a), y1 = C - R * Math.cos(i * a), x2 = C + R * Math.sin((i + 1) * a), y2 = C - R * Math.cos((i + 1) * a);
    sl += `<path d="M${C} ${C} L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z" fill="url(#${i % 2 ? 'gd' : 'gr'})" stroke="#e8c46a" stroke-width="1.2"/>`;
    const c = (i + .5) * 360 / N;
    sl += `<g transform="rotate(${c} ${C} ${C})"><text x="${C}" y="${C - 92}" transform="rotate(-90 ${C} ${C - 92})" text-anchor="middle" dominant-baseline="middle" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width=".8" paint-order="stroke" font-size="${N > 8 ? 15 : 19}" font-weight="900">${esc(prizeLabel({ kind: z.kind, value: z.value }))}</text></g>`;
  });
  let bulbs = '';
  for (let k = 0; k < 20; k++) { const t = k * Math.PI / 10; bulbs += `<circle cx="${C + 141 * Math.sin(t)}" cy="${C - 141 * Math.cos(t)}" r="3.6" fill="${k % 2 ? '#fff4c4' : '#ff7a7e'}"><animate attributeName="opacity" values="${k % 2 ? '1;.25;1' : '.25;1;.25'}" dur="1.4s" repeatCount="indefinite"/></circle>`; }
  return `<svg class="wheel" id="wheel" viewBox="0 0 300 300" style="transform:rotate(${S.rot}deg)">
    <defs>
      <radialGradient id="gr" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#a3202a"/><stop offset="1" stop-color="#ff5a60"/></radialGradient>
      <radialGradient id="gd" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#2a2a30"/></radialGradient>
      <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
    </defs>
    <circle cx="150" cy="150" r="149" fill="url(#gg)"/><circle cx="150" cy="150" r="134" fill="#000"/>${sl}${bulbs}
    <circle cx="150" cy="150" r="133.5" fill="none" stroke="url(#gg)" stroke-width="2.5"/></svg>`;
}
function spinState() {
  const z = S.spin, now = Date.now();
  const active = z && !z.redeemed && new Date(z.expires_at) > now;
  const cool = z && !z.test && !S.isAdmin && (new Date(z.created_at).getTime() + 86400000 > now) ? new Date(z.created_at).getTime() + 86400000 : 0;
  return { z, active, cool };
}
function wheelPanel() {
  const { z, active, cool } = spinState();
  const wp = S.products.find(p => p.id === S.home.wheelProduct);
  let h = '';
  if (!wp || S.prizes.length < 2) {
    return `<div class="wnote" style="font-size:16px">${T('wsoon')}</div>`;
  }
  const btnTxt = cool ? `${T('next')} <span class="cd" data-ts="${cool}">${hms(cool - Date.now())}</span>` : (S.isAdmin ? T('spinTest') : T('spin'));
  h += `<button class="btn full" data-act="spin" ${cool || S.spinning ? 'disabled' : ''}>${btnTxt}</button><div class="wnote">${T('wheelHow')}</div>`;
  if (z) {
    const p = S.products.find(x => x.id === z.product_id);
    const ttl = p ? tr(p, 'title') : z.product_title;
    const exp = new Date(z.expires_at).getTime();
    const st = z.redeemed ? T('used') : exp > Date.now() ? '' : T('expired');
    h += `<div class="pz ${st ? 'used' : ''}"><h3>${T('won')}</h3><div class="pv">${prizeLabel(z)}</div>
      <div style="color:#ddd">${T('forItem')}: <b>${esc(ttl)}</b></div>
      ${p ? `<div style="margin-top:4px;color:#ddd">${T('priceWith')}: <b style="color:#ff6b6f">${price(withPrize(p, z))}</b> <span class="old">${price(p.price)}</span></div>` : ''}
      <div class="code">${esc(z.code)}</div>
      ${st ? `<div class="st">${st}</div>` : `<div class="tm cd" data-ts="${exp}">${hms(exp - Date.now())}</div><div class="st">${T('left')} · ${T('showSeller')}</div>`}
      ${p ? `<button class="btn full" style="margin:14px 0 0" data-act="open" data-id="${p.id}">${T('openItem')}</button>` : ''}</div>`;
  }
  return h;
}
function viewWheel() {
  return `<h1 class="row"><button class="back" data-act="tab" data-tab="home">←</button>${T('wheel')}</h1>
    <div class="wwrap"><div class="ptr"></div>${wheelSvg()}<div class="hub">SS</div></div><div id="wpanel">${wheelPanel()}</div>`;

async function doSpin() {
  if (S.spinning) return;
  S.spinning = true; tg.tap();
  const b = document.querySelector('[data-act="spin"]'); if (b) b.disabled = true;
  try {
    const r = await api('/api/wheel/spin', { method: 'POST' });
    const N = S.prizes.length; let i = S.prizes.findIndex(z => z.id === r.prizeId); if (i < 0) i = 0;
    const center = (i + .5) * 360 / N;
    S.rot = Math.ceil(S.rot / 360) * 360 + 360 * 6 + (360 - center);
    const w = $('wheel'); if (w) w.style.transform = `rotate(${S.rot}deg)`;
    await new Promise(res => setTimeout(res, 5300));
    S.spin = r.spin; tg.ok();
  } catch (e) {
    if (e.status === 429) { try { S.spin = (await api('/api/wheel/me')).spin; } catch (x) {} tg.alert(T('cool')); }
    else if (e.status === 409) tg.alert(T('wsoon'));
    else tg.alert(T('err'));
  }
  S.spinning = false;
  if (S.tab === 'wheel' && $('wpanel')) $('wpanel').innerHTML = wheelPanel();
}
setInterval(() => {
  const els = document.querySelectorAll('.cd'); let again = false;
  els.forEach(el => { const left = Number(el.dataset.ts) - Date.now(); el.textContent = hms(left); if (left <= 0) again = true; });
  if (again && S.tab === 'wheel' && !S.spinning && $('wpanel')) $('wpanel').innerHTML = wheelPanel();
}, 1000);

(function zoomTouch() {
  const el = $('zv'); let mode = null, d0 = 0, s0 = 1, sx = 0, sy = 0, ox = 0, oy = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const clampPan = () => { const im = Z.img; if (!im) return; const mx = (im.clientWidth * Z.scale - innerWidth) / 2, my = (im.clientHeight * Z.scale - innerHeight) / 2;
    Z.x = Math.max(-Math.max(0, mx), Math.min(Math.max(0, mx), Z.x)); Z.y = Math.max(-Math.max(0, my), Math.min(Math.max(0, my), Z.y)); };

    if (e.touches.length === 2) { Z.img = zImg(); mode = 'pinch'; d0 = dist(e.touches); s0 = Z.scale; e.preventDefault(); }
    else if (e.touches.length === 1) {

      Z.t = now;

    }

  }, { passive: false });

})();

    <label>Картинка (лучше широкая, 16:9)</label>${F.url ? `<img class="cvp" src="${esc(F.url)}">` : '<div class="hint">Без картинки будет красный фон.</div>'}
    <label class="fileb">${F.url ? 'Заменить картинку' : 'Загрузить картинку'}<input id="b_file" type="file" accept="image/*"></label>
    ${F.url && F.id ? '<button class="sm" style="margin-top:8px" data-act="b-noimg">Убрать картинку</button>' : ''}
    <label>Заголовок (RU)</label><input id="b_title_ru" type="text" value="${esc(F.title_ru)}">
    <label>Заголовок (EN)</label><input id="b_title_en" type="text" value="${esc(F.title_en)}">
    <label>Текст под заголовком (RU)</label><input id="b_text_ru" type="text" value="${esc(F.text_ru)}">
    <label>Текст под заголовком (EN)</label><input id="b_text_en" type="text" value="${esc(F.text_en)}">
    <label>Куда ведёт при нажатии</label><select id="b_target" class="sel">${targets.map(([v, t]) => `<option value="${v}" ${v === F.target ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <div style="height:22px"></div><button class="btn full" id="f_save" data-act="form-save">Сохранить</button>
  </div>`;
  const fi = $('b_file');
  if (fi) fi.addEventListener('change', async () => {
    readForm();
    if (!fi.files[0]) return;
    try { const data = await compress(fi.files[0], 1600); F.image = data; F.url = data; F.removeImage = false; } catch (e) { tg.alert(T('err')); }
    renderBannerForm();
  });
}
function compress(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
async function saveForm() {
  readForm();
  const F = S.form;
  const btn = $('f_save');
  if (F.type === 'banner') {
    btn.disabled = true; btn.textContent = 'Сохранение…';
    try {
      await api(F.id ? '/api/admin/banners/' + F.id : '/api/admin/banners', { method: F.id ? 'PUT' : 'POST',
        body: { title_ru: F.title_ru, title_en: F.title_en, text_ru: F.text_ru, text_en: F.text_en, target: F.target, image: F.image, removeImage: F.removeImage } });
      S.form = null; $('fm').classList.remove('show'); updateBack(); await reloadAdmin();
    } catch (e) { btn.disabled = false; btn.textContent = 'Сохранить'; tg.alert(T('err') + ': ' + e.message); }
    return;
  }
  if (!F.title_ru.trim() && !F.title_en.trim()) return tg.alert('Введите название');
  btn.disabled = true; btn.textContent = 'Сохранение…';
  try {
    await api(F.id ? '/api/admin/products/' + F.id : '/api/admin/products', {
      method: F.id ? 'PUT' : 'POST',
      body: { title_ru: F.title_ru, title_en: F.title_en, desc_ru: F.desc_ru, desc_en: F.desc_en, price: F.price, old_price: F.old_price, cond: F.cond, brand: F.brand,
        category: F.category, sizes: F.sizes, sold: F.sold, photos: F.photos.map(p => p.id ? { id: p.id } : { data: p.data }) }
    });
    S.form = null; $('fm').classList.remove('show'); updateBack(); await reloadAdmin();
  } catch (e) { btn.disabled = false; btn.textContent = 'Сохранить'; tg.alert(T('err') + ': ' + e.message); }
}

/* ---------- navigation ---------- */
function updateBack() {
  const open = !!(S.pv || S.form || S.zoom !== null);
  try { open ? WA.BackButton.show() : WA.BackButton.hide(); } catch (e) {}
}
function closeTop() {
  if (S.zoom !== null) closeZoom();
  else if (S.sheet) hideSheet();
  else if (S.form) { S.form = null; $('fm').classList.remove('show'); }
  else if (S.pv) { S.pv = null; $('pv').classList.remove('show'); }
  updateBack();
}
try { WA.BackButton.onClick(closeTop); } catch (e) {}

async function admCall(path, method, body, then) {
  try { await api(path, { method, body }); await reloadAdmin(); if (then) then(); } catch (e) { tg.alert(T('err') + ': ' + e.message); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id);
  if (act === 'fav') { e.stopPropagation(); return toggleFav(id); }
  if (act === 'invite') return inviteShare();
  if (act === 'daily-toggle') return admCall('/api/admin/settings', 'PUT', { daily: !S.aStats.dailyOn }, () => {});
  if (act === 'daily-test') { try { await api('/api/admin/daily-test', { method: 'POST' }); tg.alert('Сводка отправлена в чат с ботом'); } catch (er) { tg.alert(T('err') + ': ' + er.message); } return; }
  if (act === 'backup') { try { await api('/api/admin/backup-send', { method: 'POST' }); tg.alert('Копия отправлена в чат с ботом'); } catch (er) { tg.alert(T('err') + ': ' + er.message); } return; }
  if (act === 'ref-save') return admCall('/api/admin/settings', 'PUT', { ref_amount: $('refamt').value }, () => {});
  if (act === 'cp-use') return admCall('/api/admin/coupons/' + id + '/use', 'PATCH', {}, () => {});
  if (act === 'open') { if (Date.now() - S.lp < 800) return; return openProduct(id); }
  if (act === 'msg') return messageManager(id);
  if (act === 'share') return shareProduct(id);
  if (act === 'zoom') return openZoom(Number(el.dataset.i));
  if (act === 'zoom-close') return closeZoom();
  if (act === 'size') { S.pvSize = el.dataset.v; document.querySelectorAll('#szs .szb').forEach(b => { b.classList.remove('need'); b.classList.toggle('on', b.dataset.v === S.pvSize); }); tg.tap(); return; }
  if (act === 'brand') { tg.tap(); S.fBrand = new Set([el.dataset.v]); S.fSize.clear(); S.pmin = ''; S.pmax = ''; S.sort = 'def'; S.tab = 'catalog'; S.cat = ''; S.q = ''; render(); scrollTo(0, 0); return; }
  if (act === 'smax-save') return admCall('/api/admin/settings', 'PUT', { sale_max: $('smax').value }, () => tg.alert('Сохранено'));
  if (act === 'bc-test' || act === 'bc-send') {
    const text = ($('bc').value || '').trim(); if (!text) return tg.alert('Введите текст сообщения');
    if (act === 'bc-test') { try { await api('/api/admin/broadcast', { method: 'POST', body: { text, test: true } }); tg.alert('Тест отправлен вам в Telegram'); } catch (er) { tg.alert(T('err')); } return; }
    return tg.confirm('Отправить сообщение всем (' + S.aAud + ' чел.)?', async ok => {
      if (!ok) return;
      try { const r = await api('/api/admin/broadcast', { method: 'POST', body: { text } }); tg.alert('Рассылка запущена (' + r.queued + ' чел.). Когда закончится, придёт отчёт в Telegram.'); }
      catch (er) { tg.alert(er.status === 409 ? 'Предыдущая рассылка ещё идёт' : T('err')); }
    });
  }
  if (act === 'bn-up' || act === 'bn-down') return admCall('/api/admin/banners/' + id + '/move', 'PATCH', { dir: act === 'bn-up' ? -1 : 1 });
  if (act === 'tab') {
    const t = el.dataset.tab; S.tab = t; S.q = ''; tg.tap(); S.fBrand.clear(); S.fSize.clear(); S.pmin = ''; S.pmax = ''; S.sort = 'def';
    if (t === 'catalog' || t === 'sale') { S.cat = ''; }
    render(); scrollTo(0, 0);
    if (t === 'wheel') { try { S.spin = (await api('/api/wheel/me')).spin; if (S.tab === 'wheel' && $('wpanel')) $('wpanel').innerHTML = wheelPanel(); } catch (x) {} }
    if (t === 'admin') { await adminTabLoad(); if (S.tab === 'admin') render(); }
    return;
  }
  if (act === 'bn') { const t = el.dataset.t; if (!t) return; if (t === 'tiktok') return tg.link(S.cfg.tiktok);
    S.tab = t; S.q = ''; S.fBrand.clear(); S.fSize.clear(); S.pmin = ''; S.pmax = ''; S.sort = 'def'; render(); scrollTo(0, 0); if (t === 'wheel') { try { S.spin = (await api('/api/wheel/me')).spin; if ($('wpanel')) $('wpanel').innerHTML = wheelPanel(); } catch (x) {} } return; }
  if (act === 'cat') { S.cat = el.dataset.cat; $('app').innerHTML = viewCatalog('catalog'); return; }
  if (act === 'tiktok') return tg.link(S.cfg.tiktok);
  if (act === 'sheet') return showSheet(el.dataset.s);
  if (act === 'disc') { S.discId = id; return showSheet('disc'); }
  if (act === 'disc-ok' || act === 'disc-off') {
    const p = S.products.find(x => x.id === S.discId); if (!p) return;
    const base = discBase(p), pct = parseInt($('d_pct').value, 10);
    if (act === 'disc-ok' && !(pct > 0 && pct < 100)) return tg.alert('Введите скидку от 1 до 99 %');
    const body = act === 'disc-ok' ? { price: Math.round(base * (1 - pct / 100)), old_price: base } : { price: base, old_price: 0 };
    hideSheet(); return admCall('/api/admin/products/' + p.id + '/price', 'PATCH', body);
  }
  if (act === 'sheet-close') { if (S.sheet === 'disc') return hideSheet(); hideSheet(); const y = scrollY; $('app').innerHTML = viewCatalog(S.tab === 'sale' ? 'sale' : 'catalog'); scrollTo(0, y); return; }
  if (act === 'sh-sort') { S.sort = el.dataset.v; $('sheet').innerHTML = sheetHtml(); return; }
  if (act === 'sh-brand' || act === 'sh-size') { const set = act === 'sh-brand' ? S.fBrand : S.fSize, v = el.dataset.v; set.has(v) ? set.delete(v) : set.add(v); $('sheet').innerHTML = sheetHtml(); return; }
  if (act === 'sh-reset') { if (S.sheet === 'brand') S.fBrand.clear(); if (S.sheet === 'size') S.fSize.clear(); if (S.sheet === 'price') { S.pmin = ''; S.pmax = ''; } $('sheet').innerHTML = sheetHtml(); return; }
  if (act === 'spin') return doSpin();
  // admin
  if (act === 'atab') { S.at = el.dataset.at; await adminTabLoad(); return render(); }
  if (act === 'new') return newForm(null);
  if (act === 'edit') return newForm(S.products.find(p => p.id === id));
  if (act === 'toggle') return admCall('/api/admin/products/' + id + '/sold', 'PATCH');
  if (act === 'del') return tg.confirm('Удалить товар?', ok => { if (ok) admCall('/api/admin/products/' + id, 'DELETE'); });
  if (act === 'bn-new') return newBanner(null);
  if (act === 'bn-edit') return newBanner(S.banners.find(b => b.id === id));
  if (act === 'bn-del') return tg.confirm('Удалить баннер?', ok => { if (ok) admCall('/api/admin/banners/' + id, 'DELETE'); });
  if (act === 'b-noimg') { readForm(); S.form.url = ''; S.form.image = null; S.form.removeImage = true; return renderBannerForm(); }
  if (act === 'cover-del') return admCall('/api/admin/settings', 'PUT', { [el.dataset.k]: null });
  if (act === 'brand-add') { const v = $('nb').value.trim(); if (v) admCall('/api/admin/brands', 'POST', { name: v }); return; }
  if (act === 'brand-del') return tg.confirm('Удалить бренд из списка?', ok => { if (ok) admCall('/api/admin/brands/' + id, 'DELETE'); });
  if (act === 'tk-save') return admCall('/api/admin/settings', 'PUT', { tiktok: $('tk').value }, () => tg.alert('Сохранено'));
  if (act === 'pz-add') { const v = parseInt($('pv_').value, 10); if (!v) return tg.alert('Введите размер приза'); return admCall('/api/admin/prizes', 'POST', { kind: $('pk').value, value: v, weight: $('pw').value || 1 }); }
  if (act === 'pz-on') return admCall('/api/admin/prizes/' + id + '/active', 'PATCH');
  if (act === 'pz-del') return tg.confirm('Удалить приз?', ok => { if (ok) admCall('/api/admin/prizes/' + id, 'DELETE'); });
  if (act === 'spin-redeem') return admCall('/api/admin/spins/' + id + '/redeem', 'PATCH');
  if (act === 'form-close' || act === 'pv-close') return closeTop();
  if (act === 'form-save') return saveForm();
  if (act === 'ph-del') { readForm(); S.form.photos.splice(Number(el.dataset.i), 1); return renderForm(); }
  if (act === 'ph-first') { readForm(); const [ph] = S.form.photos.splice(Number(el.dataset.i), 1); S.form.photos.unshift(ph); return renderForm(); }
});
document.addEventListener('change', async e => {
  const k = e.target.dataset && e.target.dataset.ch; if (!k) return;
  if (k === 'wprod') return admCall('/api/admin/settings', 'PUT', { wheel_product: e.target.value });
  if (k === 'bnphoto' && e.target.files[0]) {
    try { const data = await compress(e.target.files[0], 1600); await admCall('/api/admin/banners', 'POST', { image: data, target: 'catalog' }); } catch (er) { tg.alert(T('err')); }
    return;
  }
  if (k.startsWith('cover:') && e.target.files[0]) {
    try { const data = await compress(e.target.files[0], 1600); await admCall('/api/admin/settings', 'PUT', { [k.slice(6)]: data }); } catch (er) { tg.alert(T('err')); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; refreshGrid(); }
  if (e.target.id === 'hq') {
    S.q = e.target.value; S.tab = 'catalog'; S.cat = ''; render(); scrollTo(0, 0);
    const el = $('q'); if (el) { el.focus(); el.setSelectionRange(S.q.length, S.q.length); }
  }
  if (e.target.id === 'd_pct') { const p = S.products.find(x => x.id === S.discId); if (p && $('d_prev')) $('d_prev').innerHTML = discPrev(p, parseInt(e.target.value, 10)); }
  if (e.target.id === 'sh_min') S.pmin = e.target.value;
  if (e.target.id === 'sh_max') S.pmax = e.target.value;
});

(function theme() {
  const root = document.documentElement, b = $('theme');
  const apply = on => { root.classList.toggle('light', on); b.textContent = on ? '☾' : '☀';
    const c = on ? '#ffffff' : '#000000'; tg.call('setHeaderColor', c); tg.call('setBackgroundColor', c); };
  let on = false; try { on = localStorage.getItem('theme') === 'light'; } catch (e) {}
  apply(on);
  b.addEventListener('click', () => { on = !on; apply(on); try { localStorage.setItem('theme', on ? 'light' : 'dark'); } catch (e) {} });
})();
$('lang').addEventListener('click', () => {
  S.lang = S.lang === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem('lang', S.lang); } catch (e) {}
  if (S.form) readForm();
  if (S.sheet) $('sheet').innerHTML = sheetHtml();
  render();
});

(async function init() {
  let refNew = 0;
  try {
    const sp0 = WA && WA.initDataUnsafe && WA.initDataUnsafe.start_param, mr = /^r(\d+)$/.exec(sp0 || '');
    if (mr && tg.initData) { const r = await api('/api/ref', { method: 'POST', body: { inviter: Number(mr[1]) } }); if (r && r.created) refNew = r.amount; }
  } catch (e) {}
  try { await loadAll(); document.title = S.cfg.shop; }
  catch (e) { $('app').innerHTML = '<div class="empty">Connection error</div>'; hideSplash(); return; }
  render();
  track('open');
  if (refNew) setTimeout(() => tg.alert(T('cpWelcome').replace('{n}', refNew)), 600);
  const sp = WA && WA.initDataUnsafe && WA.initDataUnsafe.start_param, m = /^p(\d+)$/.exec(sp || '');
  if (m && S.products.some(p => p.id === Number(m[1]))) openProduct(Number(m[1]));
  hideSplash();
})();
</script>
